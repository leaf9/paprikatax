[build]
  command = "npm run build"
  publish = "dist"

# Immutable cache for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback (single landing page today, safe for future routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
